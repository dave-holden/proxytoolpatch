[project]
name = "proxytoolpatch"
version = "0.0.0"
description = "Workspace root: global dev tooling + shared configs for the proxytoolpatch sub-projects"
requires-python = ">=3.11"
# No hard runtime deps at the workspace root on purpose: dev deps live in the
# dependency-groups below; model-server runtimes (mlx-lm etc.) belong to the
# backend you launch, not to this meta-package.
dependencies = []

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "respx>=0.23",
    "coverage>=7",
    # starlette>=1.7 TestClient prefers httpx2; without it it falls back to
    # the legacy httpx and emits a StarletteDeprecationWarning on every run.
    "httpx2>=2.13",
    "ruff>=0.14",
    "pyright>=1.1.407",
    "nox>=2024.10",
    "mlx-lm>=0.31.3",
]

[tool.pytest.ini_options]
testpaths = ["apps/proxytool/tests", "packages/toolpatch/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["toolpatch", "proxytool"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise RuntimeError",          # starlette testclient fallback guard
    "if __name__ == .__main__.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/proxytool/src", "packages/toolpatch/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
# Check against the lowest supported floor so runtime behaviour (e.g. the
# stdlib tomllib in proxytool.config) is checked the way it runs on 3.11.
pythonVersion = "3.11"
include = [
    "apps/proxytool/src",
    "packages/toolpatch/src",
    "apps/proxytool/tests",
    "packages/toolpatch/tests",
]
exclude = ["**/__pycache__", ".venv", "scripts"]
# No venvPath/venv pin: pyright resolves imports from the environment it runs
# in (PATH/VIRTUAL_ENV), which CI provisions via
# `uv run --python 3.11 --isolated --all-packages`. A pinned root .venv would
# not exist in CI and goes stale locally whenever packages change.

