# llama-swap swap demo — three models, one loaded at a time.
#
#   llama-swap --config examples/llama-swap/config.yml --listen 127.0.0.1:8080
#
# Needs:
#   brew install llama.cpp        # provides `llama` (GGUF backends: `llama serve`)
#   uv tool install mlx-lm        # provides mlx_lm.server (MLX backend)
#
# Prefetch the small Qwen once (otherwise the first swap also downloads ~500 MB):
#   hf download Qwen/Qwen2.5-0.5B-Instruct-GGUF \
#     --include '*q4_k_m.gguf'
#
# The YAML keys ARE the model ids clients send, so proxytool, pi and
# opencode use them verbatim — no proxytool --model-map is required.
# Rename a key here and you must update the client configs to match.

healthCheckTimeout: 500   # 14B cold load; plenty for the 0.5B too
logLevel: info
globalTTL: 120            # seconds idle before unload (makes swaps visible)

models:
  qwen-gguf:
    cmd: >
      llama serve --host 127.0.0.1 --port ${PORT}
      -c 16384 -ngl 999 --jinja -a qwen-gguf
      -hf Qwen/Qwen2.5-Coder-14B-Instruct-GGUF
      --hf-file qwen2.5-coder-14b-instruct-q4_0.gguf

  qwen-mlx:
    # mlx_lm.server has no /health, so health-check the OpenAI models route.
    checkEndpoint: /v1/models
    # llama-swap routes on the request's `model` field but forwards it
    # unchanged; mlx_lm.server then treats "qwen-mlx" as an HF repo id and
    # 404s "Repository Not Found". Send the real artifact instead.
    useModelName: mlx-community/Qwen2.5-Coder-14B-Instruct-4bit
    cmd: >
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model mlx-community/Qwen2.5-Coder-14B-Instruct-4bit

  qwen2.5-0.5b-instruct-gguf:
    cmd: >
      llama serve --host 127.0.0.1 --port ${PORT}
      -c 8192 -ngl 999 --jinja -a qwen2.5-0.5b-instruct-gguf
      -hf Qwen/Qwen2.5-0.5B-Instruct-GGUF
      --hf-file qwen2.5-0.5b-instruct-q4_k_m.gguf

# One member resident at a time: asking for another model evicts the current
# one. (`exclusive: true` also unloads anything outside this group.)
routing:
  router:
    use: group
    settings:
      groups:
        "swap":
          swap: true
          exclusive: true
          members:
            - "qwen-gguf"
            - "qwen-mlx"
            - "qwen2.5-0.5b-instruct-gguf"
