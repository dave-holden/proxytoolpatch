# proxytool config file — copy to ~/.config/proxytool/config.toml (or drop
# as ./proxytool.toml in the directory where you run `proxytool start`).
#
# Every key is optional; anything you pass as a CLI flag or env var
# (LTP_* / legacy LMW_*) beats this file:
#
#     CLI flag  >  env var  >  config file  >  built-in default
#
# Discovery (first hit wins): --config PATH, $LTP_CONFIG, ./proxytool.toml,
# ./.proxytool.toml, $XDG_CONFIG_HOME/proxytool/config.toml,
# ~/.config/proxytool/config.toml.

# ── server ────────────────────────────────────────────────────────────────────
host = "127.0.0.1"
port = 8180
log_level = "info"          # debug | info | warning | error

# ── single-backend setup: llama-swap (or any OpenAI-compatible gateway) ──────
[upstream]
url = "http://127.0.0.1:8080"
# backend = "gguf"          # optional repair-sanitizer hint (env LMW_BACKEND)
# timeout = 600             # seconds; cover cold model loads
# api_key = "sk-..."        # static bearer token sent upstream

# ── multi-backend routing (alternative to [upstream]) ────────────────────────
# Need proxytool itself to route several already-running backends? Uncomment
# these and DELETE the [upstream] url line — the two setups are exclusive.
# [routing.gguf]
# url = "http://127.0.0.1:8181"
# models = ["qwen-gguf", "qwen"]
#
# [routing.mlx]
# url = "http://127.0.0.1:8281"
# models = ["qwen-mlx"]
# default = true
#
# default_backend = "mlx"   # top-level: backend used when no model list matches

# ── client alias → real model id ─────────────────────────────────────────────
# Aliases in opencode/pi configs are meaningless to the upstream; this map
# rewrites them. mlx_lm.server resolves unknown ids against HF otherwise.
[model_map]
"qwen-gguf" = "qwen2.5-coder-14b-instruct"
"qwen-mlx" = "mlx-community/Qwen2.5-Coder-14B-Instruct-4bit"

# ── LoopGuard: same request repeated → nudge, then abort ─────────────────────
[loopguard]
# nudge = 3
# abort = 6

# ── payload tracing ──────────────────────────────────────────────────────────
[trace]
# enabled = false
# file = "/tmp/proxytool-trace.log"   # default: stderr
