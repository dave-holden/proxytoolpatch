name: test & checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest on purpose:
# ubuntu-latest is being rolled from 24.04 to 26.04 between 19 Oct and 19 Nov
# 2026, and this matrix resolves prebuilt wheels per interpreter/glibc — a
# base-image swap mid-window can flip a compatibility cell with no code change.
# Moving to ubuntu-26.04 (or back to ubuntu-latest) should be one deliberate PR
# that re-runs the whole matrix. Dependabot does not bump `runs-on`.

# Every job expresses its intent through a nox session (noxfile.py) instead of
# hand-written uv commands: nox is the single source of truth for what
# "tested/checked" means, so adding a Python version or session there is all
# that is needed — CI picks it up. The GH matrix below exists only for
# per-cell visibility in the Actions UI; each cell calls exactly one
# parametrized nox session.

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - run: uv run nox -s lint

  test-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        module: [toolpatch, proxytool]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          # Scope the cache key by the module (and optionally python version)
          # to prevent matrix jobs from stepping on each other's toes
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.module }}

      - name: nox test_${{ matrix.module }} on py${{ matrix.python-version }}
        run: >
          uv run nox -s
          "test_${{ matrix.module }}(python='${{ matrix.python-version }}')"

  pyright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11" # lowest floor — the nox pyright session pins 3.11 too
      - run: uv run nox -s pyright
