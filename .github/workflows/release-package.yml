name: release a package

# Triggered by scoped tags only (legacy combined `v*` tags are handled by
# publish.yml). For toolpatch-v0.4.0 this workflow:
#   1. renders the tag's changelog section as release notes,
#   2. creates the GitHub release for the tag.
# It runs beside publish.yml (same tag): that one builds + uploads to PyPI,
# this one owns the GitHub Release.
#
# CHANGELOG.md is owned by the release PR (tools/release/plan.py); it is not
# rewritten here because main is PR-protected and the bot cannot push to it.
on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-package-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changelog-and-release:
    runs-on: ubuntu-latest
    steps:
      # Full history + all tags; check out the default branch so the changelog
      # commit can be pushed straight onto it (publish.yml builds from the tag).
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: resolve package and version from the tag
        id: pkg
        run: |
          set -euo pipefail
          # Tab-separated "<name> <repo-relative dir> <version>"; aborts when
          # the tag does not match the package's pyproject version (same guard
          # as publish.yml).
          IFS=$'\t' read -r name dir version \
            < <(tools/release/changelog.sh resolve "${GITHUB_REF_NAME}")
          echo "name=$name"   >> "$GITHUB_OUTPUT"
          echo "dir=$dir"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: rebuild release notes for the tag
        run: |
          set -euo pipefail
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            tools/release/changelog.sh notes \
              "${{ steps.pkg.outputs.name }}" "${GITHUB_REF_NAME}" \
              -o "${{ runner.temp }}/release-notes.md"
          if [ ! -s "${{ runner.temp }}/release-notes.md" ]; then
            # Nothing changelog-worthy survived the filters; still give the
            # release a body instead of an empty one.
            printf 'See [CHANGELOG.md](%s/blob/main/%s/CHANGELOG.md).\n' \
              "${{ github.server_url }}/${{ github.repository }}" \
              "${{ steps.pkg.outputs.dir }}"\
                > "${{ runner.temp }}/release-notes.md"
          fi

      - name: create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}"
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          make_latest: ${{ !contains(github.ref_name, 'rc') && 'true' || 'false' }}
