name: publish toolpatch + proxytool

on:
  push:
    tags: ["v*"]

jobs:
  tests-gate:
    uses: ./.github/workflows/test.yml   # must declare `on: workflow_call`

  build:
    needs: tests-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv build --package toolpatch --out-dir dist/toolpatch
      - run: uv build --package proxytool --out-dir dist/proxytool
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/proxytool/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: publish to testpypi
        run: |
          for pkg in toolpatch proxytool; do
            uv publish \
              --trusted-publishing always \
              --publish-url https://test.pypi.org/legacy/ \
              --check-url https://test.pypi.org/simple/ \
              dist/$pkg/*
          done
      - name: smoke-test from testpypi
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd /tmp
          uv venv smoke
          # retry: index propagation can lag a few seconds
          for i in 1 2 3 4 5; do
            uv pip install --python smoke/bin/python --refresh \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "proxytool==$VERSION" && break
            sleep 15
          done
          smoke/bin/python -c "import toolpatch; print(toolpatch.__all__)"
          smoke/bin/proxytool version

  publish-pypi:
    needs: publish-testpypi
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proxytool/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: publish to pypi
        run: |
          for pkg in toolpatch proxytool; do
            uv publish \
              --trusted-publishing always \
              --check-url https://pypi.org/simple/ \
              dist/$pkg/*
          done
      - name: smoke-test from pypi
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd /tmp
          uv venv smoke
          for i in 1 2 3 4 5; do
            uv pip install --python smoke/bin/python --refresh "proxytool==$VERSION" && break
            sleep 15
          done
          smoke/bin/python -c "import toolpatch; print(toolpatch.__all__)"
          smoke/bin/proxytool version
