name: release tags

# A merged release PR only moves the declared version in `pyproject.toml`. What
# actually ships is the tag: `publish.yml` builds and publishes from it, and
# `release-package.yml` creates the GitHub Release from that same tag. So a
# forgotten tag leaves `main` declaring a version that exists on no index, and
# the planner keeps seeing that release's commits as unreleased — which is how
# the phantom "next version" PR #47 appeared.
#
# Deliberately NOT triggered by pushes to main: the tag is pushed by hand a few
# seconds after the merge, so a push-triggered run would go red on the very
# release it guards. A daily pass catches a genuinely forgotten tag within a
# day, and costs nothing otherwise.
on:
  schedule:
    - cron: "43 5 * * *" # daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-24.04
    steps:
      # Full clone: the tags are the whole point, and `git describe` needs the
      # history behind them to tell "never released" from "tag forgotten".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: every declared version has its tag
        run: |-
          set -euo pipefail
          # Same stdlib-only invocation as release-pr.yml: keep the planner off
          # the workspace venv so syncing the packages cannot break it.
          uv run --no-project --python 3.13 tools/release/plan.py --check-tags
